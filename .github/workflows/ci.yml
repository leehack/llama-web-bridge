name: CI

on:
  workflow_dispatch:
    inputs:
      run_speech_to_text_smoke:
        description: Run the opt-in Qwen3-ASR browser smoke
        required: false
        default: false
        type: boolean
      run_text_to_speech_smoke:
        description: Run the opt-in Qwen3-TTS browser smoke
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-webgpu-bridge:
    name: Build WebGPU Bridge (WASM)
    runs-on: ubuntu-latest
    env:
      LLAMA_WEBGPU_SMOKE_MODEL_URL: https://huggingface.co/aladar/llama-2-tiny-random-GGUF/resolve/main/llama-2-tiny-random.gguf
      LLAMA_WEBGPU_SMOKE_MODEL_SHA256: 81f226c62d28ed4a1a9b9fa080fcd9f0cc40e0f9d5680036583ff98fbcd035cb
      LLAMA_WEBGPU_SMOKE_MODEL_CACHE: ~/.cache/llama-web-bridge/state-smoke-models
      LLAMA_WEBGPU_SMOKE_ARTIFACTS_DIR: /tmp/state-persistence-smoke-artifacts
      LLAMA_WEBGPU_MULTIMODAL_MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
      LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
      LLAMA_WEBGPU_MULTIMODAL_MMPROJ_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/mmproj-F16.gguf
      LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256: 56e4c6cfe73b0c82e3e82bc518d7591997e61d81f723fc41a586f4fa69ea2453
      LLAMA_WEBGPU_MULTIMODAL_MODEL_CACHE: ~/.cache/llama-web-bridge/multimodal-smoke-models
      LLAMA_WEBGPU_MULTIMODAL_ARTIFACTS_DIR: /tmp/multimodal-smoke-artifacts
      LLAMA_WEBGPU_MULTIMODAL_TIMEOUT_MS: 420000
      LLAMA_WEBGPU_SPEECH_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/Qwen3-ASR-0.6B-Q8_0.gguf?download=true
      LLAMA_WEBGPU_SPEECH_MODEL_SHA256: bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971
      LLAMA_WEBGPU_SPEECH_MMPROJ_URL: https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf?download=true
      LLAMA_WEBGPU_SPEECH_MMPROJ_SHA256: 41a342b5e4c514e968cb756de6cd1b7be39eff43c44c57a2ef5fc6522e36603d
      LLAMA_WEBGPU_SPEECH_MODEL_CACHE: ~/.cache/llama-web-bridge/speech-smoke-models
      LLAMA_WEBGPU_SPEECH_ARTIFACTS_DIR: /tmp/speech-to-text-smoke-artifacts
      LLAMA_WEBGPU_SPEECH_TIMEOUT_MS: 900000
      LLAMA_WEBGPU_TTS_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/ca27d74bc954b73dadab5b71ca265d87fc861a7c/Qwen3-TTS-12Hz-1.7B-Base-Q4_K_M.gguf?download=true
      LLAMA_WEBGPU_TTS_MODEL_SHA256: 8d18c94acb2addd042f97da63c98be144eafa76d0d9495177eab65130cf85129
      LLAMA_WEBGPU_TTS_MMPROJ_URL: https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/ca27d74bc954b73dadab5b71ca265d87fc861a7c/mmproj-Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf?download=true
      LLAMA_WEBGPU_TTS_MMPROJ_SHA256: 6fd65188839bcd6ecc91b277ad471e22a0edfada4699a0fe82f1165c18cfcce2
      LLAMA_WEBGPU_TTS_MODEL_CACHE: ~/.cache/llama-web-bridge/text-to-speech-smoke-models
      LLAMA_WEBGPU_TTS_ARTIFACTS_DIR: /tmp/text-to-speech-smoke-artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Validate JS bridge build
        run: |
          npm run check:js
          git ls-files --error-unmatch js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts
          git diff --exit-code -- js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts

      - name: Resolve llama.cpp pin
        run: |
          LLAMA_CPP_TAG="$(tr -d '[:space:]' < llama_cpp.version)"
          if [ -z "$LLAMA_CPP_TAG" ]; then
            echo "error: llama_cpp.version is empty"
            exit 1
          fi
          echo "LLAMA_CPP_TAG=$LLAMA_CPP_TAG" >> "$GITHUB_ENV"
          echo "Using llama.cpp ${LLAMA_CPP_TAG}"

      - name: Validate state persistence API contract
        run: python3 scripts/verify_state_persistence_api.py

      - name: Validate text-to-speech API contract
        run: python3 scripts/verify_text_to_speech_api.py

      - name: Validate Python smoke syntax
        run: |
          python3 -m py_compile \
            scripts/verify_state_persistence_api.py \
            scripts/verify_text_to_speech_api.py \
            scripts/verify_ci_reliability.py \
            scripts/state_persistence_browser_smoke.py \
            scripts/multimodal_browser_smoke.py \
            scripts/speech_to_text_browser_smoke.py \
            scripts/text_to_speech_browser_smoke.py

      - name: Verify CI reliability contract
        run: python3 scripts/verify_ci_reliability.py

      - name: Cache state smoke model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/state-smoke-models
          key: state-smoke-model-${{ env.LLAMA_WEBGPU_SMOKE_MODEL_SHA256 }}

      - name: Cache multimodal smoke models
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/multimodal-smoke-models
          key: multimodal-smoke-${{ env.LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256 }}-${{ env.LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256 }}

      - name: Cache speech-to-text smoke models
        if: github.event_name == 'workflow_dispatch' && inputs.run_speech_to_text_smoke
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/speech-smoke-models
          key: speech-smoke-${{ env.LLAMA_WEBGPU_SPEECH_MODEL_SHA256 }}-${{ env.LLAMA_WEBGPU_SPEECH_MMPROJ_SHA256 }}

      - name: Cache text-to-speech smoke models
        if: github.event_name == 'workflow_dispatch' && inputs.run_text_to_speech_smoke
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/text-to-speech-smoke-models
          key: text-to-speech-smoke-${{ env.LLAMA_WEBGPU_TTS_MODEL_SHA256 }}-${{ env.LLAMA_WEBGPU_TTS_MMPROJ_SHA256 }}

      - name: Download verified text-to-speech smoke models
        if: github.event_name == 'workflow_dispatch' && inputs.run_text_to_speech_smoke
        run: |
          set -euo pipefail
          cache_dir="${LLAMA_WEBGPU_TTS_MODEL_CACHE/#\~/$HOME}"
          mkdir -p "${cache_dir}"
          model_path="${cache_dir}/Qwen3-TTS-12Hz-1.7B-Base-Q4_K_M.gguf"
          mmproj_path="${cache_dir}/mmproj-Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf"

          download_verified() {
            local url="$1"
            local expected_sha="$2"
            local output_path="$3"
            if [ -f "${output_path}" ] && echo "${expected_sha}  ${output_path}" | sha256sum --check --status; then
              return
            fi
            rm -f "${output_path}" "${output_path}.download"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "${output_path}.download" "${url}"
            echo "${expected_sha}  ${output_path}.download" | sha256sum --check --status
            mv "${output_path}.download" "${output_path}"
          }

          download_verified "${LLAMA_WEBGPU_TTS_MODEL_URL}" "${LLAMA_WEBGPU_TTS_MODEL_SHA256}" "${model_path}"
          download_verified "${LLAMA_WEBGPU_TTS_MMPROJ_URL}" "${LLAMA_WEBGPU_TTS_MMPROJ_SHA256}" "${mmproj_path}"
          echo "LLAMA_WEBGPU_TTS_MODEL_PATH=${model_path}" >> "${GITHUB_ENV}"
          echo "LLAMA_WEBGPU_TTS_MMPROJ_PATH=${mmproj_path}" >> "${GITHUB_ENV}"

      - name: Clone llama.cpp source
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git third_party/llama_cpp

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build bridge artifacts
        env:
          OUT_DIR: ${{ runner.temp }}/webgpu_bridge_dist
          WEBGPU_BRIDGE_BUILD_MEM64: 1
        run: ./scripts/build_bridge.sh

      - name: Verify outputs
        run: |
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge_worker.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.d.ts"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.wasm"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.wasm"

      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium

      - name: Run state persistence browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: python3 scripts/state_persistence_browser_smoke.py

      - name: Run multimodal browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: python3 scripts/multimodal_browser_smoke.py

      - name: Run Qwen3-ASR browser smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_speech_to_text_smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: python3 scripts/speech_to_text_browser_smoke.py

      - name: Run Qwen3-TTS browser smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_text_to_speech_smoke
        run: |
          python3 scripts/text_to_speech_browser_smoke.py \
            --dist-dir "${{ runner.temp }}/webgpu_bridge_dist" \
            --model-path "${LLAMA_WEBGPU_TTS_MODEL_PATH}" \
            --mmproj-path "${LLAMA_WEBGPU_TTS_MMPROJ_PATH}" \
            --model-sha256 "${LLAMA_WEBGPU_TTS_MODEL_SHA256}" \
            --mmproj-sha256 "${LLAMA_WEBGPU_TTS_MMPROJ_SHA256}" \
            --memory-mode wasm64 \
            --runtime-mode all \
            --max-frames 24 \
            --artifacts-dir "${LLAMA_WEBGPU_TTS_ARTIFACTS_DIR}"

      - name: Upload state persistence smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-persistence-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_SMOKE_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload multimodal smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_MULTIMODAL_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload speech-to-text smoke diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.run_speech_to_text_smoke
        uses: actions/upload-artifact@v4
        with:
          name: speech-to-text-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_SPEECH_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload text-to-speech smoke diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_text_to_speech_smoke
        uses: actions/upload-artifact@v4
        with:
          name: text-to-speech-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_TTS_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-bridge-dist
          path: |
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge_worker.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.d.ts
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.wasm
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.wasm

  dispatch-publish-assets:
    name: Dispatch asset publish
    needs: build-webgpu-bridge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      ASSETS_REPO: leehack/llama-web-bridge-assets
      VERSION_FILE: llama_cpp.version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch publish when llama.cpp pin changed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "${BEFORE_SHA}" ] || [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "No comparable before SHA for ${GITHUB_SHA}; skipping automatic publish dispatch."
            exit 0
          fi

          if git diff --quiet "${BEFORE_SHA}" "${GITHUB_SHA}" -- "${VERSION_FILE}"; then
            echo "${VERSION_FILE} did not change; skipping automatic publish dispatch."
            exit 0
          fi

          changed_files="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- "${VERSION_FILE}")"
          echo "Changed files in main push:"
          echo "${changed_files}"

          LLAMA_CPP_TAG="$(tr -d '[:space:]' < "${VERSION_FILE}")"
          if [ -z "${LLAMA_CPP_TAG}" ]; then
            echo "error: ${VERSION_FILE} is empty"
            exit 1
          fi

          gh workflow run publish_assets.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f assets_tag=auto \
            -f assets_repo="${ASSETS_REPO}" \
            -f source_ref="${GITHUB_SHA}"

          echo "Dispatched publish_assets.yml for the next assets tag from source ${GITHUB_SHA} using llama.cpp ${LLAMA_CPP_TAG}."
          {
            echo "### Asset publish dispatched"
            echo
            echo "- Assets repo: \`${ASSETS_REPO}\`"
            echo "- Assets tag: next patch tag resolved by \`publish_assets.yml\`"
            echo "- llama.cpp tag: \`${LLAMA_CPP_TAG}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
