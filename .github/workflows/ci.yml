name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Select CI validation
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/ci_scope.mjs

  checks:
    name: JS and workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate JS bridge build
        run: |
          npm run check:js
          git ls-files --error-unmatch js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts
          git diff --exit-code -- js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts

      - name: Verify CI reliability contract
        run: node scripts/ci/verify_ci_reliability.mjs

  build-webgpu-bridge:
    needs: [changes, checks]
    if: needs.changes.outputs.native == 'true'
    name: Build WebGPU Bridge (WASM)
    runs-on: ubuntu-latest
    env:
      LLAMA_WEBGPU_SMOKE_MODEL_URL: https://huggingface.co/aladar/llama-2-tiny-random-GGUF/resolve/main/llama-2-tiny-random.gguf
      LLAMA_WEBGPU_SMOKE_MODEL_SHA256: 81f226c62d28ed4a1a9b9fa080fcd9f0cc40e0f9d5680036583ff98fbcd035cb
      LLAMA_WEBGPU_SMOKE_MODEL_CACHE: ~/.cache/llama-web-bridge/state-smoke-models
      LLAMA_WEBGPU_SMOKE_ARTIFACTS_DIR: /tmp/state-persistence-smoke-artifacts
      LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR: /tmp/grammar-smoke-artifacts
      LLAMA_WEBGPU_NEXT_TOKEN_SCORES_ARTIFACTS_DIR: /tmp/next-token-scores-smoke-artifacts
      LLAMA_WEBGPU_SPECULATIVE_ARTIFACTS_DIR: /tmp/speculative-smoke-artifacts
      LLAMA_WEBGPU_MULTIMODAL_MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
      LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
      LLAMA_WEBGPU_MULTIMODAL_MMPROJ_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/mmproj-F16.gguf
      LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256: 56e4c6cfe73b0c82e3e82bc518d7591997e61d81f723fc41a586f4fa69ea2453
      LLAMA_WEBGPU_MULTIMODAL_MODEL_CACHE: ~/.cache/llama-web-bridge/multimodal-smoke-models
      LLAMA_WEBGPU_MULTIMODAL_ARTIFACTS_DIR: /tmp/multimodal-smoke-artifacts
      LLAMA_WEBGPU_MULTIMODAL_TIMEOUT_MS: 420000
      LLAMA_WEBGPU_GRAMMAR_MULTIMODAL_TIMEOUT_MS: 900000
      LLAMA_WEBGPU_SPEECH_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/Qwen3-ASR-0.6B-Q8_0.gguf?download=true
      LLAMA_WEBGPU_SPEECH_MODEL_SHA256: bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971
      LLAMA_WEBGPU_SPEECH_MMPROJ_URL: https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf?download=true
      LLAMA_WEBGPU_SPEECH_MMPROJ_SHA256: 41a342b5e4c514e968cb756de6cd1b7be39eff43c44c57a2ef5fc6522e36603d
      LLAMA_WEBGPU_TTS_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/ca27d74bc954b73dadab5b71ca265d87fc861a7c/Qwen3-TTS-12Hz-1.7B-Base-Q4_K_M.gguf?download=true
      LLAMA_WEBGPU_TTS_MODEL_SHA256: 8d18c94acb2addd042f97da63c98be144eafa76d0d9495177eab65130cf85129
      LLAMA_WEBGPU_TTS_MMPROJ_URL: https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/ca27d74bc954b73dadab5b71ca265d87fc861a7c/mmproj-Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf?download=true
      LLAMA_WEBGPU_TTS_MMPROJ_SHA256: 6fd65188839bcd6ecc91b277ad471e22a0edfada4699a0fe82f1165c18cfcce2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Resolve llama.cpp pin
        run: |
          LLAMA_CPP_TAG="$(tr -d '[:space:]' < llama_cpp.version)"
          if [ -z "$LLAMA_CPP_TAG" ]; then
            echo "error: llama_cpp.version is empty"
            exit 1
          fi
          echo "LLAMA_CPP_TAG=$LLAMA_CPP_TAG" >> "$GITHUB_ENV"
          echo "Using llama.cpp ${LLAMA_CPP_TAG}"

      - name: Resolve Emscripten SDK pin
        run: |
          EMSCRIPTEN_VERSION="$(node scripts/build/verify_emscripten_version.mjs --print-pin)"
          echo "EMSCRIPTEN_VERSION=${EMSCRIPTEN_VERSION}" >> "$GITHUB_ENV"
          echo "Using Emscripten ${EMSCRIPTEN_VERSION}"

      - name: Cache state smoke model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/state-smoke-models
          key: state-smoke-model-${{ env.LLAMA_WEBGPU_SMOKE_MODEL_SHA256 }}

      - name: Cache multimodal smoke models
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/multimodal-smoke-models
          key: multimodal-smoke-${{ env.LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256 }}-${{ env.LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256 }}

      - name: Clone llama.cpp source
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git third_party/llama_cpp

      # Installed at a fixed path, not with setup-emsdk: its random temp
      # directory changes the compiler and sysroot paths on every run, so
      # ccache never hits.
      - name: Setup Emscripten SDK
        env:
          EMSDK_DIR: ${{ runner.temp }}/emsdk
        run: |
          git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          "$EMSDK_DIR/emsdk" install "$EMSCRIPTEN_VERSION"
          "$EMSDK_DIR/emsdk" activate "$EMSCRIPTEN_VERSION"
          source "$EMSDK_DIR/emsdk_env.sh"
          {
            echo "PATH=$PATH"
            echo "EMSDK=$EMSDK"
            echo "EMSDK_NODE=$EMSDK_NODE"
            if [ -n "${EM_CONFIG:-}" ]; then echo "EM_CONFIG=$EM_CONFIG"; fi
          } >> "$GITHUB_ENV"

      - name: Verify resolved Emscripten compiler
        run: node scripts/build/verify_emscripten_version.mjs --emit-github-env "$GITHUB_ENV"

      - name: Resolve compiler cache identity
        id: compiler-cache
        run: echo "upstream=$(git -C third_party/llama_cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache

      # Every run restores the newest cache from its branch or main; only
      # pushes to main save one, so pull requests do not grow the cache. The
      # last prefix still warms a build that changes the build inputs or the
      # llama.cpp pin: CCACHE_COMPILERCHECK=content makes a stale entry a miss,
      # never a wrong hit.
      - name: Restore compiler objects
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/webgpu-ccache
          key: webgpu-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSCRIPTEN_VERSION }}-${{ steps.compiler-cache.outputs.upstream }}-${{ hashFiles('CMakeLists.txt', 'scripts/build/build_bridge.sh', 'scripts/build/patch_*.mjs') }}-${{ github.sha }}
          restore-keys: |
            webgpu-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSCRIPTEN_VERSION }}-${{ steps.compiler-cache.outputs.upstream }}-${{ hashFiles('CMakeLists.txt', 'scripts/build/build_bridge.sh', 'scripts/build/patch_*.mjs') }}-
            webgpu-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSCRIPTEN_VERSION }}-

      - name: Build bridge artifacts
        env:
          BUILD_DIR: ${{ runner.temp }}/webgpu-build
          MEM64_BUILD_DIR: ${{ runner.temp }}/webgpu-build-mem64
          CCACHE_DIR: ${{ runner.temp }}/webgpu-ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
          EM_COMPILER_WRAPPER: ccache
          OUT_DIR: ${{ runner.temp }}/webgpu_bridge_dist
          WEBGPU_BRIDGE_BUILD_MEM64: 1
        run: |
          ccache --zero-stats
          trap 'ccache --show-stats' EXIT
          ./scripts/build/build_bridge.sh

      - name: Save compiler objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/webgpu-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Verify outputs
        run: |
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge_worker.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.d.ts"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.wasm"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.wasm"

      # The smokes use the locked playwright package.
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --only-shell chromium

      - name: Run state persistence browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/state_persistence.mjs

      - name: Run multimodal browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/multimodal.mjs

      - name: Run grammar browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: |
          node scripts/smoke/grammar.mjs \
            --artifacts-dir "$LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR/state-smoke-model"
          node scripts/smoke/grammar.mjs \
            --model-url "$LLAMA_WEBGPU_MULTIMODAL_MODEL_URL" \
            --model-sha256 "$LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256" \
            --model-cache-dir "$LLAMA_WEBGPU_MULTIMODAL_MODEL_CACHE" \
            --timeout-ms "$LLAMA_WEBGPU_GRAMMAR_MULTIMODAL_TIMEOUT_MS" \
            --artifacts-dir "$LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR/multimodal-model"

      - name: Run next-token scores browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/next_token_scores.mjs

      - name: Run speculative decoding browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/speculative.mjs --group tiny

      - name: Upload state persistence smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-persistence-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_SMOKE_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload multimodal smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_MULTIMODAL_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload grammar smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload next-token scores smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-token-scores-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_NEXT_TOKEN_SCORES_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload speculative decoding smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: speculative-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_SPECULATIVE_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-bridge-dist
          path: |
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge_worker.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.d.ts
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.wasm
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.wasm

  ci-result:
    name: CI validation
    if: always()
    needs: [changes, checks, build-webgpu-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate selected job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci_scope.mjs --check-results
