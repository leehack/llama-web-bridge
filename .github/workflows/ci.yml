name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  LLAMA_WEBGPU_SMOKE_MODEL_URL: https://huggingface.co/aladar/llama-2-tiny-random-GGUF/resolve/main/llama-2-tiny-random.gguf
  LLAMA_WEBGPU_SMOKE_MODEL_SHA256: 81f226c62d28ed4a1a9b9fa080fcd9f0cc40e0f9d5680036583ff98fbcd035cb
  LLAMA_WEBGPU_SMOKE_MODEL_CACHE: ~/.cache/llama-web-bridge/state-smoke-models
  LLAMA_WEBGPU_SMOKE_ARTIFACTS_DIR: /tmp/state-persistence-smoke-artifacts
  LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR: /tmp/grammar-smoke-artifacts
  LLAMA_WEBGPU_NEXT_TOKEN_SCORES_ARTIFACTS_DIR: /tmp/next-token-scores-smoke-artifacts
  LLAMA_WEBGPU_SPECULATIVE_ARTIFACTS_DIR: /tmp/speculative-smoke-artifacts
  LLAMA_WEBGPU_MULTIMODAL_MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
  LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
  LLAMA_WEBGPU_MULTIMODAL_MMPROJ_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/mmproj-F16.gguf
  LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256: 56e4c6cfe73b0c82e3e82bc518d7591997e61d81f723fc41a586f4fa69ea2453
  LLAMA_WEBGPU_MULTIMODAL_MODEL_CACHE: ~/.cache/llama-web-bridge/multimodal-smoke-models
  LLAMA_WEBGPU_MULTIMODAL_ARTIFACTS_DIR: /tmp/multimodal-smoke-artifacts
  LLAMA_WEBGPU_MULTIMODAL_TIMEOUT_MS: 420000
  LLAMA_WEBGPU_GRAMMAR_MULTIMODAL_TIMEOUT_MS: 900000
  LLAMA_WEBGPU_SPEECH_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/Qwen3-ASR-0.6B-Q8_0.gguf?download=true
  LLAMA_WEBGPU_SPEECH_MODEL_SHA256: bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971
  LLAMA_WEBGPU_SPEECH_MMPROJ_URL: https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf?download=true
  LLAMA_WEBGPU_SPEECH_MMPROJ_SHA256: 41a342b5e4c514e968cb756de6cd1b7be39eff43c44c57a2ef5fc6522e36603d
  LLAMA_WEBGPU_TTS_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/ca27d74bc954b73dadab5b71ca265d87fc861a7c/Qwen3-TTS-12Hz-1.7B-Base-Q4_K_M.gguf?download=true
  LLAMA_WEBGPU_TTS_MODEL_SHA256: 8d18c94acb2addd042f97da63c98be144eafa76d0d9495177eab65130cf85129
  LLAMA_WEBGPU_TTS_MMPROJ_URL: https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/ca27d74bc954b73dadab5b71ca265d87fc861a7c/mmproj-Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf?download=true
  LLAMA_WEBGPU_TTS_MMPROJ_SHA256: 6fd65188839bcd6ecc91b277ad471e22a0edfada4699a0fe82f1165c18cfcce2

jobs:
  changes:
    name: Select CI validation
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/ci_scope.mjs

  checks:
    name: JS and workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate JS bridge build
        run: |
          npm run check:js
          git ls-files --error-unmatch js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts
          git diff --exit-code -- js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts

      - name: Verify CI reliability contract
        run: node scripts/ci/verify_ci_reliability.mjs

  build-core:
    name: Build core (${{ matrix.variant }})
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [wasm32, wasm64, wasm32_st, wasm64_st]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve llama.cpp pin
        run: |
          LLAMA_CPP_TAG="$(tr -d '[:space:]' < llama_cpp.version)"
          if [ -z "$LLAMA_CPP_TAG" ]; then
            echo "error: llama_cpp.version is empty"
            exit 1
          fi
          echo "LLAMA_CPP_TAG=$LLAMA_CPP_TAG" >> "$GITHUB_ENV"
          echo "Using llama.cpp ${LLAMA_CPP_TAG}"

      - name: Resolve Emscripten SDK pin
        run: |
          EMSCRIPTEN_VERSION="$(node scripts/build/verify_emscripten_version.mjs --print-pin)"
          echo "EMSCRIPTEN_VERSION=${EMSCRIPTEN_VERSION}" >> "$GITHUB_ENV"
          echo "Using Emscripten ${EMSCRIPTEN_VERSION}"

      - name: Clone llama.cpp source
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git third_party/llama_cpp
          test "$(git -C third_party/llama_cpp rev-parse HEAD)" = b1b770d90d94cad9e9ea5b993bdbc383a522fb28

      - name: Resolve compiler cache identity
        id: compiler-cache
        run: echo "upstream=$(git -C third_party/llama_cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore built core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/webgpu_bridge_dist
          key: webgpu-core-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ env.EMSCRIPTEN_VERSION }}-${{ steps.compiler-cache.outputs.upstream }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**', 'scripts/build/build_bridge.sh', 'scripts/build/patch_wasm64_runtime.mjs', '.github/workflows/ci.yml') }}

      # A stable SDK path keeps compiler and sysroot paths stable for ccache.
      - name: Setup Emscripten SDK
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          EMSDK_DIR: ${{ runner.temp }}/emsdk
        run: |
          git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          "$EMSDK_DIR/emsdk" install "$EMSCRIPTEN_VERSION"
          "$EMSDK_DIR/emsdk" activate "$EMSCRIPTEN_VERSION"
          source "$EMSDK_DIR/emsdk_env.sh"
          {
            echo "PATH=$PATH"
            echo "EMSDK=$EMSDK"
            echo "EMSDK_NODE=$EMSDK_NODE"
            if [ -n "${EM_CONFIG:-}" ]; then echo "EM_CONFIG=$EM_CONFIG"; fi
          } >> "$GITHUB_ENV"

      - name: Verify resolved Emscripten compiler
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: node scripts/build/verify_emscripten_version.mjs --emit-github-env "$GITHUB_ENV"

      - name: Restore Emscripten cache
        id: emcache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/emcache
          key: emcache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install compiler cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Restore compiler objects
        id: ccache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/webgpu-ccache
          key: webgpu-ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ env.EMSCRIPTEN_VERSION }}-${{ steps.compiler-cache.outputs.upstream }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'scripts/build/build_bridge.sh', 'scripts/build/patch_*.mjs', 'src/**') }}
          restore-keys: |
            webgpu-ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ env.EMSCRIPTEN_VERSION }}-${{ steps.compiler-cache.outputs.upstream }}-

      - name: Build bridge artifacts
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          BUILD_DIR: ${{ runner.temp }}/webgpu-build
          MEM64_BUILD_DIR: ${{ runner.temp }}/webgpu-build-mem64
          SINGLE_THREAD_BUILD_DIR: ${{ runner.temp }}/webgpu-build-st
          SINGLE_THREAD_MEM64_BUILD_DIR: ${{ runner.temp }}/webgpu-build-mem64-st
          CCACHE_DIR: ${{ runner.temp }}/webgpu-ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
          EM_CACHE: ${{ runner.temp }}/emcache
          EM_COMPILER_WRAPPER: ccache
          OUT_DIR: ${{ runner.temp }}/webgpu_build_output
          CORE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
          WEBGPU_BRIDGE_VARIANT: ${{ matrix.variant }}
          WEBGPU_BRIDGE_SKIP_JS_CHECK: 1
        run: |
          ccache --zero-stats
          trap 'ccache --show-stats' EXIT
          ./scripts/build/build_bridge.sh
          mkdir -p "$CORE_DIST_DIR"
          cp "$OUT_DIR"/llama_webgpu_core*.js "$OUT_DIR"/llama_webgpu_core*.wasm "$CORE_DIST_DIR/"

      - name: Save built core
        if: steps.core-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/webgpu_bridge_dist
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - name: Save compiler objects
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.ccache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/webgpu-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Save Emscripten cache
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.emcache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/emcache
          key: ${{ steps.emcache.outputs.cache-primary-key }}

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-core-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core*.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core*.wasm
          if-no-files-found: error
          retention-days: 1

  smoke-core:
    name: Core browser smokes
    needs: [changes, build-core]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webgpu-core-*
          path: ${{ runner.temp }}/webgpu_bridge_dist
          merge-multiple: true

      - name: Copy checked-in bridge wrappers
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: |
          cp js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts "$BRIDGE_DIST_DIR/"

      - name: Verify outputs
        run: |
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge_worker.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.d.ts"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.wasm"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.wasm"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_st.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_st.wasm"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64_st.js"
          test -f "${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64_st.wasm"

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-bridge-dist
          path: |
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge_worker.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_bridge.d.ts
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core.wasm
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64.wasm
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_st.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_st.wasm
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64_st.js
            ${{ runner.temp }}/webgpu_bridge_dist/llama_webgpu_core_mem64_st.wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Cache state smoke model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/state-smoke-models
          key: state-smoke-model-${{ env.LLAMA_WEBGPU_SMOKE_MODEL_SHA256 }}

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --only-shell chromium

      - name: Install bundler smoke dependencies
        run: npm ci --ignore-scripts --prefix scripts/smoke/bundler_deps

      - name: Run npm bundler packaging browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/bundler_packaging.mjs

      - name: Run state persistence browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/state_persistence.mjs

      - name: Run memory64 extraction and state regression smoke
        id: state_mem64_gate
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/state_persistence.mjs --memory-mode wasm64

      - name: Run single-thread state persistence browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/state_persistence.mjs --threading single

      - name: Run cross-origin assets browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/cross_origin_assets.mjs

      - name: Run shared-core model staging browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
          LLAMADART_BROWSER_STAGING_MOUNT_SMOKE: '1'
        run: node --test tests/bridge/js_model_staging_shared_core_browser_test.mjs

      - name: Run single-thread memory64 state persistence browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/state_persistence.mjs --threading single --memory-mode wasm64

      - name: Run native abort recovery browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/core_abort_recovery.mjs

      - name: Run single-thread native abort recovery browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/core_abort_recovery.mjs --threading single

      - name: Run threaded core release browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/core_release.mjs

      - name: Run wasm64 core release browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/core_release.mjs --memory-mode wasm64

      - name: Run single-thread core release browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/core_release.mjs --threading single

      - name: Run remote fetch backend browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/remote_fetch_backend.mjs

      - name: Run wasm64 remote fetch backend browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/remote_fetch_backend.mjs --memory-mode wasm64

      - name: Upload state persistence smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-persistence-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_SMOKE_ARTIFACTS_DIR }}
          if-no-files-found: ignore

  smoke-resume:
    name: Resume integrity browser smokes
    needs: [changes, build-core]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webgpu-core-*
          path: ${{ runner.temp }}/webgpu_bridge_dist
          merge-multiple: true

      - name: Copy checked-in bridge wrappers
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: |
          cp js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts "$BRIDGE_DIST_DIR/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Cache state smoke model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/llama-web-bridge/state-smoke-models
          key: state-smoke-model-${{ env.LLAMA_WEBGPU_SMOKE_MODEL_SHA256 }}

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --only-shell chromium

      - name: Run threaded resume integrity browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/resume_integrity.mjs --baseline-dist-dir "$BRIDGE_DIST_DIR"

      - name: Run single-thread resume integrity browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/resume_integrity.mjs --baseline-dist-dir "$BRIDGE_DIST_DIR" --threading single

      - name: Run threaded resume integrity browser smoke with JS-backed staging
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/resume_integrity.mjs --baseline-dist-dir "$BRIDGE_DIST_DIR" --js-backed-model-staging

      - name: Run single-thread resume integrity browser smoke with JS-backed staging
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/resume_integrity.mjs --baseline-dist-dir "$BRIDGE_DIST_DIR" --threading single --js-backed-model-staging

      - name: Run threaded resume integrity with JS-backed staging and mmap disabled
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/resume_integrity.mjs --baseline-dist-dir "$BRIDGE_DIST_DIR" --js-backed-model-staging --no-mmap

      - name: Run single-thread resume integrity with JS-backed staging and mmap disabled
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/resume_integrity.mjs --baseline-dist-dir "$BRIDGE_DIST_DIR" --threading single --js-backed-model-staging --no-mmap

  smoke-multimodal:
    name: Multimodal and sampler browser smokes
    needs: [changes, build-core]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webgpu-core-*
          path: ${{ runner.temp }}/webgpu_bridge_dist
          merge-multiple: true

      - name: Copy checked-in bridge wrappers
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: |
          cp js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts "$BRIDGE_DIST_DIR/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Cache state smoke model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/llama-web-bridge/state-smoke-models
          key: state-smoke-model-${{ env.LLAMA_WEBGPU_SMOKE_MODEL_SHA256 }}

      - name: Cache multimodal smoke models
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama-web-bridge/multimodal-smoke-models
          key: multimodal-smoke-${{ env.LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256 }}-${{ env.LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256 }}

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --only-shell chromium

      - name: Run multimodal browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/multimodal.mjs

      - name: Run grammar browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: |
          node scripts/smoke/grammar.mjs \
            --artifacts-dir "$LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR/state-smoke-model"

      - name: Run next-token scores browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/next_token_scores.mjs

      - name: Run speculative decoding browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: node scripts/smoke/speculative.mjs --group tiny

      - name: Upload multimodal smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_MULTIMODAL_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload grammar smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload next-token scores smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-token-scores-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_NEXT_TOKEN_SCORES_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Upload speculative decoding smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: speculative-smoke-artifacts
          path: ${{ env.LLAMA_WEBGPU_SPECULATIVE_ARTIFACTS_DIR }}
          if-no-files-found: ignore

  smoke-grammar-qwen:
    name: Qwen grammar browser smoke (${{ matrix.memory }}, ${{ matrix.runtime }})
    needs: [changes, build-core]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        memory: [wasm32, wasm64]
        runtime: [direct, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webgpu-core-*
          path: ${{ runner.temp }}/webgpu_bridge_dist
          merge-multiple: true

      - name: Copy checked-in bridge wrappers
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
        run: |
          cp js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts "$BRIDGE_DIST_DIR/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Cache multimodal smoke models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/llama-web-bridge/multimodal-smoke-models
          key: multimodal-smoke-${{ env.LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256 }}-${{ env.LLAMA_WEBGPU_MULTIMODAL_MMPROJ_SHA256 }}

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --only-shell chromium

      - name: Run Qwen grammar browser smoke
        env:
          BRIDGE_DIST_DIR: ${{ runner.temp }}/webgpu_bridge_dist
          GRAMMAR_MEMORY_MODE: ${{ matrix.memory }}
          GRAMMAR_RUNTIME_MODE: ${{ matrix.runtime }}
        run: |
          node scripts/smoke/grammar.mjs \
            --model-url "$LLAMA_WEBGPU_MULTIMODAL_MODEL_URL" \
            --model-sha256 "$LLAMA_WEBGPU_MULTIMODAL_MODEL_SHA256" \
            --model-cache-dir "$LLAMA_WEBGPU_MULTIMODAL_MODEL_CACHE" \
            --timeout-ms "$LLAMA_WEBGPU_GRAMMAR_MULTIMODAL_TIMEOUT_MS" \
            --artifacts-dir "$LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR/multimodal-model" \
            --memory-mode "$GRAMMAR_MEMORY_MODE" \
            --runtime-mode "$GRAMMAR_RUNTIME_MODE"

      - name: Upload grammar smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-smoke-artifacts-qwen-${{ matrix.memory }}-${{ matrix.runtime }}
          path: ${{ env.LLAMA_WEBGPU_GRAMMAR_ARTIFACTS_DIR }}
          if-no-files-found: ignore

  ci-result:
    name: CI validation
    if: always()
    needs: [changes, checks, build-core, smoke-core, smoke-resume, smoke-multimodal, smoke-grammar-qwen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate selected job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci_scope.mjs --check-results
