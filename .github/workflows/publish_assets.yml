name: Publish Exact Qualified Bridge Assets

on:
  # This workflow is intentionally bridge-owned and non-reusable. A central
  # orchestrator may dispatch it, but the environment gate must execute in this
  # repository rather than in the caller's repository context.
  workflow_dispatch:
    inputs:
      orchestrator_correlation_id:
        description: Required central-orchestrator correlation identifier
        required: true
        type: string
      bridge_source_sha:
        description: Exact full llama-web-bridge source commit to build
        required: true
        type: string
      upstream_tag:
        description: Exact llama.cpp vMAJOR.MINOR.PATCH or bNNNN tag
        required: true
        type: string
      upstream_commit:
        description: Exact full commit resolved by upstream_tag
        required: true
        type: string
      native_release_tag:
        description: Exact native release tag that owns assets.json
        required: true
        type: string
      native_manifest_sha256:
        description: Expected SHA-256 of the native release assets.json
        required: true
        type: string
      release_tag:
        description: Exact output tag vMAJOR.MINOR.PATCH[-N] or bNNNN[-N]
        required: true
        type: string
      release_rebuild:
        description: Rebuild counter encoded by release_tag
        required: true
        type: number
      assets_repo:
        description: Exact approved asset repository assertion
        required: false
        default: leehack/llama-web-bridge-assets
        type: string
      publish_approved:
        description: Explicit approval recorded by the dispatching orchestrator
        required: true
        type: boolean
      candidate_run_id:
        description: Required Build Exact Bridge Candidate run ID that produced the candidate to publish
        required: true
        type: string
      attestation_run_id:
        description: Required workflow run ID that ingested the maintainer qualification attestation
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BRIDGE_SOURCE_SHA: ${{ inputs.bridge_source_sha }}
  UPSTREAM_TAG: ${{ inputs.upstream_tag }}
  UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
  NATIVE_REPO: leehack/llamadart-native
  BRIDGE_REPO: leehack/llama-web-bridge
  APPROVED_ASSETS_REPO: leehack/llama-web-bridge-assets
  NATIVE_RELEASE_TAG: ${{ inputs.native_release_tag }}
  NATIVE_MANIFEST_SHA256: ${{ inputs.native_manifest_sha256 }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_REBUILD: ${{ inputs.release_rebuild }}
  REQUESTED_ASSETS_REPO: ${{ inputs.assets_repo }}
  ASSETS_REPO: leehack/llama-web-bridge-assets
  ORCHESTRATOR_CORRELATION_ID: ${{ inputs.orchestrator_correlation_id }}
  DISPATCHING_ACTOR: ${{ github.triggering_actor }}
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
  CANDIDATE_WORKFLOW_PATH: .github/workflows/bridge_candidate.yml
  ATTESTATION_WORKFLOW_PATH: .github/workflows/qualification_attestation.yml
  CANDIDATE_ARTIFACT_NAME: exact-webgpu-bridge-dist
  ATTESTATION_ARTIFACT_NAME: qualification-attestation
  # The candidate run is the artifact's provenance of record. Its ID and URL are
  # what the candidate manifest embeds, so they -- not this publication run --
  # are the identity every publication-state comparison is made against.
  CANDIDATE_RUN_ID_STRING: ${{ inputs.candidate_run_id }}
  CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.candidate_run_id }}
  GITHUB_RUN_ID_STRING: ${{ github.run_id }}
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: publish-bridge-assets-leehack-llama-web-bridge-assets
  cancel-in-progress: false

jobs:
  validate-request:
    name: Require explicit publication approval
    runs-on: ubuntu-latest
    steps:
      - name: Validate approval boundary
        env:
          PUBLISH_APPROVED: ${{ inputs.publish_approved }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_APPROVED}" != "true" ]; then
            echo "error: publish_approved=true requires explicit maintainer approval"
            exit 1
          fi
          if [ "${REQUESTED_ASSETS_REPO}" != "${APPROVED_ASSETS_REPO}" ]; then
            echo "error: assets_repo must be exactly ${APPROVED_ASSETS_REPO}"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" != "${BRIDGE_REPO}" ]; then
            echo "error: publication workflow must execute in ${BRIDGE_REPO}"
            exit 1
          fi
          if [ "${DISPATCHING_ACTOR}" != "${REPOSITORY_OWNER}" ]; then
            echo "error: publication dispatch is restricted to ${REPOSITORY_OWNER}"
            exit 1
          fi
          if [ "${GITHUB_ACTOR}" != "${REPOSITORY_OWNER}" ]; then
            echo "error: publication actor is restricted to ${REPOSITORY_OWNER}"
            exit 1
          fi
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "error: publication run_attempt must be 1"
            exit 1
          fi
          if [[ ! "${ORCHESTRATOR_CORRELATION_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "error: invalid orchestrator_correlation_id"
            exit 1
          fi
          if [[ ! "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: candidate_run_id must be a positive integer"
            exit 1
          fi
          if [[ ! "${ATTESTATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: attestation_run_id must be a positive integer"
            exit 1
          fi
          if [ "${CANDIDATE_RUN_ID}" = "${ATTESTATION_RUN_ID}" ]; then
            echo "error: candidate and attestation runs must be distinct runs"
            exit 1
          fi
          if [[ ! "${BRIDGE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: bridge_source_sha must be a full lowercase commit SHA"
            exit 1
          fi
          bridge_default="$(gh api "repos/${BRIDGE_REPO}" --jq '.default_branch')"
          if [ "${GITHUB_REF}" != "refs/heads/${bridge_default}" ]; then
            echo "error: publication workflow must be dispatched from ${BRIDGE_REPO}'s default branch"
            exit 1
          fi
          source_status="$(gh api \
            "repos/${BRIDGE_REPO}/compare/${BRIDGE_SOURCE_SHA}...${bridge_default}" \
            --jq '.status')"
          if [ "${source_status}" != "ahead" ] && [ "${source_status}" != "identical" ]; then
            echo "error: bridge source is not reachable from ${BRIDGE_REPO}'s default branch"
            exit 1
          fi

  verify-candidate-and-attestation:
    name: Verify the exact candidate and its maintainer qualification attestation
    needs: verify-publication-environment
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      native_commit: ${{ steps.native.outputs.native_commit }}
      emscripten_version: ${{ steps.emscripten.outputs.emscripten_version }}
      candidate_fingerprint: ${{ steps.attestation.outputs.candidate_fingerprint }}
      candidate_artifact_id: ${{ steps.runs.outputs.candidate_artifact_id }}
    steps:
      - name: Checkout trusted candidate verification policy
        uses: actions/checkout@v4
        with:
          repository: leehack/llama-web-bridge
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact bridge source
        uses: actions/checkout@v4
        with:
          repository: leehack/llama-web-bridge
          ref: ${{ env.BRIDGE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: bridge-source

      - name: Validate exact bridge and release inputs
        run: |
          set -euo pipefail
          if [[ ! "${BRIDGE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [ "$(git -C bridge-source rev-parse HEAD)" != "${BRIDGE_SOURCE_SHA}" ]; then
            echo "error: checked-out bridge source does not match the requested full SHA"
            exit 1
          fi
          python3 scripts/release_contract.py validate-release \
            --release-tag "${RELEASE_TAG}" --release-rebuild "${RELEASE_REBUILD}" \
            --upstream-tag "${UPSTREAM_TAG}"
          python3 scripts/release_contract.py validate-native-request \
            --native-release-tag "${NATIVE_RELEASE_TAG}" \
            --upstream-tag "${UPSTREAM_TAG}" --upstream-commit "${UPSTREAM_COMMIT}" \
            --manifest-sha256 "${NATIVE_MANIFEST_SHA256}"
          python3 - "${ORCHESTRATOR_CORRELATION_ID}" <<'PY'
          import sys
          from scripts.release_contract import require_correlation_id
          require_correlation_id(sys.argv[1])
          PY
          python3 - "${ASSETS_REPO}" "${NATIVE_REPO}" <<'PY'
          import sys
          from scripts.release_contract import require_repository
          require_repository(sys.argv[1], "assets_repo")
          require_repository(sys.argv[2], "native_repo")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate generated JS and release contracts
        run: |
          npm ci --ignore-scripts
          npm run check:js
          git ls-files --error-unmatch js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts
          git diff --exit-code -- js/llama_webgpu_bridge.js js/llama_webgpu_bridge_worker.js js/llama_webgpu_bridge.d.ts
          python3 scripts/release_contract_test.py
          python3 scripts/generate_release_manifest_test.py
          python3 scripts/release_publication_state_test.py
          python3 scripts/release_qualification_test.py
          python3 scripts/verify_state_persistence_api.py
          python3 scripts/verify_text_to_speech_api.py
          python3 scripts/wasm64_runtime_patch_contract_test.py
          python3 scripts/verify_ci_reliability.py

      - name: Resolve immutable upstream and native release tag commits
        id: native_tag
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/native-release"
          git ls-remote https://github.com/ggml-org/llama.cpp.git \
            "refs/tags/${UPSTREAM_TAG}" "refs/tags/${UPSTREAM_TAG}^{}" \
            > "${RUNNER_TEMP}/upstream-tag-refs.txt"
          RESOLVED_UPSTREAM_COMMIT="$(python3 scripts/release_contract.py resolve-tag-commit \
            --ls-remote "${RUNNER_TEMP}/upstream-tag-refs.txt" \
            --tag "${UPSTREAM_TAG}")"
          if [ "${RESOLVED_UPSTREAM_COMMIT}" != "${UPSTREAM_COMMIT}" ]; then
            echo "error: resolved upstream tag commit does not match upstream_commit"
            exit 1
          fi
          git ls-remote "https://github.com/${NATIVE_REPO}.git" \
            "refs/tags/${NATIVE_RELEASE_TAG}" "refs/tags/${NATIVE_RELEASE_TAG}^{}" \
            > "${RUNNER_TEMP}/native-release/tag-refs.txt"
          NATIVE_TAG_COMMIT="$(python3 scripts/release_contract.py resolve-tag-commit \
            --ls-remote "${RUNNER_TEMP}/native-release/tag-refs.txt" \
            --tag "${NATIVE_RELEASE_TAG}")"
          echo "native_tag_commit=${NATIVE_TAG_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Download and independently verify native release inventory
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG_COMMIT: ${{ steps.native_tag.outputs.native_tag_commit }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/native-release"
          gh api "repos/${NATIVE_REPO}/releases/tags/${NATIVE_RELEASE_TAG}" \
            > "${RUNNER_TEMP}/native-release/release.json"
          for name in assets.json SHA256SUMS; do
            asset_id="$(jq -er --arg name "${name}" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("missing/duplicate asset") end' \
              "${RUNNER_TEMP}/native-release/release.json")"
            gh api -H "Accept: application/octet-stream" \
              "repos/${NATIVE_REPO}/releases/assets/${asset_id}" \
              > "${RUNNER_TEMP}/native-release/${name}"
          done
          IDENTITY="$(python3 scripts/release_contract.py validate-native-release \
            --manifest "${RUNNER_TEMP}/native-release/assets.json" \
            --checksums "${RUNNER_TEMP}/native-release/SHA256SUMS" \
            --release-json "${RUNNER_TEMP}/native-release/release.json" \
            --manifest-sha256 "${NATIVE_MANIFEST_SHA256}" \
            --native-release-tag "${NATIVE_RELEASE_TAG}" \
            --upstream-tag "${UPSTREAM_TAG}" --upstream-commit "${UPSTREAM_COMMIT}" \
            --native-tag-commit "${NATIVE_TAG_COMMIT}")"
          echo "native_commit=$(jq -r '.native_commit' <<<"${IDENTITY}")" >> "${GITHUB_OUTPUT}"

      - name: Verify exact upstream and native tag commits
        env:
          NATIVE_COMMIT: ${{ steps.native.outputs.native_commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${UPSTREAM_TAG}" https://github.com/ggml-org/llama.cpp.git third_party/llama_cpp
          if [ "$(git -C third_party/llama_cpp rev-parse HEAD)" != "${UPSTREAM_COMMIT}" ]; then
            echo "error: upstream tag does not resolve to requested commit"
            exit 1
          fi
          git clone --depth 1 --branch "${NATIVE_RELEASE_TAG}" \
            "https://github.com/${NATIVE_REPO}.git" "${RUNNER_TEMP}/native-source"
          if [ "$(git -C "${RUNNER_TEMP}/native-source" rev-parse HEAD)" != "${NATIVE_COMMIT}" ]; then
            echo "error: native tag does not resolve to manifest native_commit"
            exit 1
          fi

      - name: Resolve Emscripten SDK pin
        id: emscripten
        run: |
          EMSCRIPTEN_VERSION="$(python3 bridge-source/scripts/verify_emscripten_version.py --print-pin)"
          echo "EMSCRIPTEN_VERSION=${EMSCRIPTEN_VERSION}" >> "${GITHUB_ENV}"
          echo "emscripten_version=${EMSCRIPTEN_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Prove the candidate and attestation run identities
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runs"
          bridge_default="$(gh api "repos/${BRIDGE_REPO}" --jq '.default_branch')"
          for pair in "candidate:${CANDIDATE_RUN_ID}:${CANDIDATE_WORKFLOW_PATH}:${CANDIDATE_ARTIFACT_NAME}" \
                      "attestation:${ATTESTATION_RUN_ID}:${ATTESTATION_WORKFLOW_PATH}:${ATTESTATION_ARTIFACT_NAME}"; do
            label="${pair%%:*}"; rest="${pair#*:}"
            run_id="${rest%%:*}"; rest="${rest#*:}"
            workflow_path="${rest%%:*}"; artifact_name="${rest#*:}"
            run_attempt_args=(--run-attempt 1)
            gh api "repos/${BRIDGE_REPO}/actions/runs/${run_id}" \
              > "${RUNNER_TEMP}/runs/${label}-run.json"
            gh api "repos/${BRIDGE_REPO}/actions/runs/${run_id}/artifacts?per_page=100" \
              > "${RUNNER_TEMP}/runs/${label}-artifacts.json"
            verification="$(python3 scripts/release_qualification.py verify-run \
              --run-json "${RUNNER_TEMP}/runs/${label}-run.json" \
              --artifacts-json "${RUNNER_TEMP}/runs/${label}-artifacts.json" \
              --run-id "${run_id}" --workflow-path "${workflow_path}" \
              --head-branch "${bridge_default}" --artifact-name "${artifact_name}" \
              "${run_attempt_args[@]}" \
            )"
            head_sha="$(jq -er '.head_sha' <<<"${verification}")"
            artifact_id="$(jq -er '.artifact_id' <<<"${verification}")"
            if [ "${label}" = "candidate" ]; then
              echo "CANDIDATE_ARTIFACT_ID=${artifact_id}" >> "${GITHUB_ENV}"
              echo "candidate_artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
            else
              echo "ATTESTATION_ARTIFACT_ID=${artifact_id}" >> "${GITHUB_ENV}"
            fi
            run_status="$(gh api \
              "repos/${BRIDGE_REPO}/compare/${head_sha}...${bridge_default}" \
              --jq '.status')"
            if [ "${run_status}" != "ahead" ] && [ "${run_status}" != "identical" ]; then
              echo "error: ${label} run head ${head_sha} is not reachable from ${bridge_default}"
              exit 1
            fi
          done

      - name: Download the exact candidate artifact and its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate" "${RUNNER_TEMP}/attestation"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${BRIDGE_REPO}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            > "${RUNNER_TEMP}/candidate.zip"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${BRIDGE_REPO}/actions/artifacts/${ATTESTATION_ARTIFACT_ID}/zip" \
            > "${RUNNER_TEMP}/attestation.zip"
          python3 - \
            "${RUNNER_TEMP}/candidate.zip" "${RUNNER_TEMP}/candidate" \
            "${RUNNER_TEMP}/attestation.zip" "${RUNNER_TEMP}/attestation" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release_qualification import _extract_flat_artifact_archive
          _extract_flat_artifact_archive(
              Path(sys.argv[1]), Path(sys.argv[2]), artifact_type="candidate"
          )
          _extract_flat_artifact_archive(
              Path(sys.argv[3]), Path(sys.argv[4]), artifact_type="attestation"
          )
          PY
          (cd "${RUNNER_TEMP}/candidate" && sha256sum --check sha256sums.txt)

      - name: Verify the attestation binds this exact candidate and every identity
        id: attestation
        env:
          NATIVE_COMMIT: ${{ steps.native.outputs.native_commit }}
        run: |
          set -euo pipefail
          python3 scripts/release_qualification.py verify-attestation \
            --attestation "${RUNNER_TEMP}/attestation/qualification-attestation.json" \
            --candidate-dist "${RUNNER_TEMP}/candidate" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --candidate-run-attempt 1 \
            --harness-dir bridge-source/scripts \
            --bridge-commit "${BRIDGE_SOURCE_SHA}" \
            --upstream-tag "${UPSTREAM_TAG}" \
            --upstream-commit "${UPSTREAM_COMMIT}" \
            --native-release-tag "${NATIVE_RELEASE_TAG}" \
            --native-manifest-sha256 "${NATIVE_MANIFEST_SHA256}" \
            --native-commit "${NATIVE_COMMIT}" \
            --emscripten-version "${EMSCRIPTEN_VERSION}" \
            --release-tag "${RELEASE_TAG}" \
            --release-rebuild "${RELEASE_REBUILD}" \
            --orchestrator-correlation-id "${ORCHESTRATOR_CORRELATION_ID}"
          FINGERPRINT="$(python3 scripts/release_qualification.py candidate-fingerprint \
            --candidate-dist "${RUNNER_TEMP}/candidate")"
          echo "candidate_fingerprint=${FINGERPRINT}" >> "${GITHUB_OUTPUT}"

      - name: Upload the verified candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: exact-webgpu-bridge-dist
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate/llama_webgpu_bridge.js
            ${{ runner.temp }}/candidate/llama_webgpu_bridge_worker.js
            ${{ runner.temp }}/candidate/llama_webgpu_bridge.d.ts
            ${{ runner.temp }}/candidate/llama_webgpu_core.js
            ${{ runner.temp }}/candidate/llama_webgpu_core.wasm
            ${{ runner.temp }}/candidate/llama_webgpu_core_mem64.js
            ${{ runner.temp }}/candidate/llama_webgpu_core_mem64.wasm
            ${{ runner.temp }}/candidate/manifest.json
            ${{ runner.temp }}/candidate/sha256sums.txt

      - name: Upload the verified qualification attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-qualification-attestation
          if-no-files-found: error
          path: ${{ runner.temp }}/attestation/qualification-attestation.json

      - name: Record exact qualification conclusions
        if: always()
        env:
          CANDIDATE_FINGERPRINT: ${{ steps.attestation.outputs.candidate_fingerprint }}
        run: |
          jq -n --arg correlation "${ORCHESTRATOR_CORRELATION_ID}" \
            --arg run_id "${GITHUB_RUN_ID_STRING}" --arg run_url "${GITHUB_RUN_URL}" \
            --arg candidate_run "${CANDIDATE_RUN_ID}" \
            --arg attestation_run "${ATTESTATION_RUN_ID}" \
            --arg fingerprint "${CANDIDATE_FINGERPRINT}" \
            '{schema_version:1,orchestrator_correlation_id:$correlation,
              github_run_id:$run_id,github_run_url:$run_url,
              candidate_run_id:$candidate_run,attestation_run_id:$attestation_run,
              candidate_fingerprint:$fingerprint,
              qualification_gates:{state_persistence:"passed",multimodal:"passed",
                speech_to_text:"required-local-attestation",
                text_to_speech:"required-local-attestation"}}' \
            > "${RUNNER_TEMP}/qualification-outcome.json"

      - name: Upload exact qualification conclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-qualification-outcome
          path: ${{ runner.temp }}/qualification-outcome.json

  verify-publication-environment:
    name: Verify externally configured publication environment
    needs: validate-request
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      environment_name: ${{ steps.environment.outputs.environment_name }}
    steps:
      - name: Checkout trusted publication policy contract
        uses: actions/checkout@v4
        with:
          repository: leehack/llama-web-bridge
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed unless the publication environment policy exists
        id: environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${BRIDGE_REPO}/environments/bridge-assets-publication" \
            > "${RUNNER_TEMP}/publication-environment.json"
          gh api "repos/${BRIDGE_REPO}/environments/bridge-assets-publication/deployment-branch-policies" \
            > "${RUNNER_TEMP}/publication-branch-policies.json"
          python3 scripts/release_contract.py validate-environment \
            --environment-json "${RUNNER_TEMP}/publication-environment.json" \
            --branch-policies-json "${RUNNER_TEMP}/publication-branch-policies.json"
          echo "environment_name=bridge-assets-publication" >> "${GITHUB_OUTPUT}"

  publish-assets:
    name: Publish or recover exact approved assets
    needs: [verify-publication-environment, verify-candidate-and-attestation]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Resolve the environment name only after the bridge-owned API check proves
    # that it already exists with the required main-only deployment policy. A
    # missing environment is never referenced by this privileged job and
    # therefore cannot be accepted as an auto-created gate.
    environment:
      name: ${{ needs.verify-publication-environment.outputs.environment_name }}
    env:
      CANDIDATE_FINGERPRINT: ${{ needs.verify-candidate-and-attestation.outputs.candidate_fingerprint }}
    outputs:
      publication_outcome: ${{ steps.final.outputs.publication_outcome }}
    steps:
      - name: Checkout trusted publication policy contract
        uses: actions/checkout@v4
        with:
          repository: leehack/llama-web-bridge
          ref: ${{ github.sha }}
          persist-credentials: false
          path: publication-policy

      - name: Checkout exact bridge owner source
        uses: actions/checkout@v4
        with:
          repository: leehack/llama-web-bridge
          ref: ${{ env.BRIDGE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: bridge-source

      - name: Checkout fixed assets target without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: leehack/llama-web-bridge-assets
          fetch-depth: 0
          persist-credentials: false
          path: assets-repo

      - name: Download gated bridge assets
        uses: actions/download-artifact@v4
        with:
          name: exact-webgpu-bridge-dist
          path: bridge-dist

      - name: Download the verified qualification attestation
        uses: actions/download-artifact@v4
        with:
          name: verified-qualification-attestation
          path: attestation

      - name: Re-verify the attestation against the candidate about to be published
        env:
          NATIVE_COMMIT: ${{ needs.verify-candidate-and-attestation.outputs.native_commit }}
          EMSCRIPTEN_VERSION: ${{ needs.verify-candidate-and-attestation.outputs.emscripten_version }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify-candidate-and-attestation.outputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          python3 publication-policy/scripts/release_qualification.py verify-attestation \
            --attestation attestation/qualification-attestation.json \
            --candidate-dist bridge-dist \
            --candidate-fingerprint "${CANDIDATE_FINGERPRINT}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --candidate-run-attempt 1 \
            --harness-dir bridge-source/scripts \
            --bridge-commit "${BRIDGE_SOURCE_SHA}" \
            --upstream-tag "${UPSTREAM_TAG}" \
            --upstream-commit "${UPSTREAM_COMMIT}" \
            --native-release-tag "${NATIVE_RELEASE_TAG}" \
            --native-manifest-sha256 "${NATIVE_MANIFEST_SHA256}" \
            --native-commit "${NATIVE_COMMIT}" \
            --emscripten-version "${EMSCRIPTEN_VERSION}" \
            --release-tag "${RELEASE_TAG}" \
            --release-rebuild "${RELEASE_REBUILD}" \
            --orchestrator-correlation-id "${ORCHESTRATOR_CORRELATION_ID}"

      - name: Revalidate publication environment policy before using PAT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${BRIDGE_REPO}/environments/bridge-assets-publication" \
            > "${RUNNER_TEMP}/post-approval-publication-environment.json"
          gh api "repos/${BRIDGE_REPO}/environments/bridge-assets-publication/deployment-branch-policies" \
            > "${RUNNER_TEMP}/post-approval-publication-branch-policies.json"
          python3 publication-policy/scripts/release_contract.py validate-environment \
            --environment-json "${RUNNER_TEMP}/post-approval-publication-environment.json" \
            --branch-policies-json "${RUNNER_TEMP}/post-approval-publication-branch-policies.json"

      - name: Verify source ancestry and classify exact remote state
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.WEBGPU_BRIDGE_ASSETS_PAT }}
          NATIVE_COMMIT: ${{ needs.verify-candidate-and-attestation.outputs.native_commit }}
          EMSCRIPTEN_VERSION: ${{ needs.verify-candidate-and-attestation.outputs.emscripten_version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "error: WEBGPU_BRIDGE_ASSETS_PAT is required for asset publication"
            exit 1
          fi
          python3 publication-policy/scripts/release_publication_state.py validate-target \
            --assets-repo "${ASSETS_REPO}" >/dev/null
          (cd bridge-dist && sha256sum --check sha256sums.txt)

          bridge_default="$(gh api "repos/${BRIDGE_REPO}" --jq '.default_branch')"
          source_status="$(gh api \
            "repos/${BRIDGE_REPO}/compare/${BRIDGE_SOURCE_SHA}...${bridge_default}" \
            --jq '.status')"
          if [ "${source_status}" != "ahead" ] && [ "${source_status}" != "identical" ]; then
            echo "error: bridge source is not reachable from ${BRIDGE_REPO}'s default branch"
            exit 1
          fi

          assets_branch="$(gh api "repos/${ASSETS_REPO}" --jq '.default_branch')"
          git -C assets-repo fetch --force origin \
            "+refs/heads/${assets_branch}:refs/remotes/origin/${assets_branch}"
          branch_commit="$(git -C assets-repo rev-parse "refs/remotes/origin/${assets_branch}")"

          git -C assets-repo ls-remote origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            > "${RUNNER_TEMP}/existing-asset-tag-refs.txt"
          tag_commit=""
          if [ -s "${RUNNER_TEMP}/existing-asset-tag-refs.txt" ]; then
            tag_commit="$(python3 publication-policy/scripts/release_contract.py resolve-tag-commit \
              --ls-remote "${RUNNER_TEMP}/existing-asset-tag-refs.txt" \
              --tag "${RELEASE_TAG}")"
          fi
          if [ -n "${tag_commit}" ]; then
            git -C assets-repo fetch --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            if [ "$(git -C assets-repo rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "${tag_commit}" ]; then
              echo "error: fetched asset release tag changed after immutable resolution"
              exit 1
            fi
          fi

          release_args=()
          set +e
          gh api "repos/${ASSETS_REPO}/releases/tags/${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/existing-release.json" 2> "${RUNNER_TEMP}/release-lookup.err"
          lookup_status=$?
          set -e
          if [ "${lookup_status}" -eq 0 ]; then
            release_args=(--release-json "${RUNNER_TEMP}/existing-release.json")
          elif ! grep -q '(HTTP 404)' "${RUNNER_TEMP}/release-lookup.err"; then
            cat "${RUNNER_TEMP}/release-lookup.err" >&2
            exit "${lookup_status}"
          fi

          args=(
            --repository assets-repo --candidate bridge-dist
            --branch-commit "${branch_commit}"
            --release-tag "${RELEASE_TAG}" --release-rebuild "${RELEASE_REBUILD}"
            --assets-repo "${ASSETS_REPO}"
            --bridge-commit "${BRIDGE_SOURCE_SHA}"
            --upstream-tag "${UPSTREAM_TAG}" --upstream-commit "${UPSTREAM_COMMIT}"
            --native-release-tag "${NATIVE_RELEASE_TAG}"
            --native-manifest-sha256 "${NATIVE_MANIFEST_SHA256}"
            --native-commit "${NATIVE_COMMIT}"
            --emscripten-version "${EMSCRIPTEN_VERSION}"
            --orchestrator-correlation-id "${ORCHESTRATOR_CORRELATION_ID}"
            --github-run-id "${CANDIDATE_RUN_ID_STRING}" --github-run-url "${CANDIDATE_RUN_URL}"
          )
          [ -n "${tag_commit}" ] && args+=(--tag-commit "${tag_commit}")
          args+=("${release_args[@]}")
          if ! python3 publication-policy/scripts/release_publication_state.py classify \
            "${args[@]}" > "${RUNNER_TEMP}/preflight.json"; then
            cat "${RUNNER_TEMP}/preflight.json"
            cp "${RUNNER_TEMP}/preflight.json" "${RUNNER_TEMP}/publication-outcome.json"
            exit 1
          fi
          cat "${RUNNER_TEMP}/preflight.json"
          {
            echo "assets_branch=${assets_branch}"
            echo "action=$(jq -r '.action' "${RUNNER_TEMP}/preflight.json")"
            echo "initial_outcome=$(jq -r '.outcome' "${RUNNER_TEMP}/preflight.json")"
            echo "fingerprint=$(jq -r '.candidate_fingerprint' "${RUNNER_TEMP}/preflight.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare deterministic release notes
        env:
          FINGERPRINT: ${{ steps.preflight.outputs.fingerprint }}
        run: |
          {
            echo "Exact-input WebGPU bridge asset release."
            echo
            echo "Candidate fingerprint: \`${FINGERPRINT}\`"
            echo
            echo "Release: \`${RELEASE_TAG}\` (rebuild \`${RELEASE_REBUILD}\`)"
            echo "Bridge: \`${BRIDGE_REPO}@${BRIDGE_SOURCE_SHA}\`"
            echo "llama.cpp: \`${UPSTREAM_TAG}@${UPSTREAM_COMMIT}\`"
            echo "Native: \`${NATIVE_REPO}@${NATIVE_RELEASE_TAG}\`"
            echo "Native manifest SHA-256: \`${NATIVE_MANIFEST_SHA256}\`"
            echo "Emscripten: \`${{ needs.verify-candidate-and-attestation.outputs.emscripten_version }}\`"
            echo "Orchestrator correlation: \`${ORCHESTRATOR_CORRELATION_ID}\`"
            echo "Candidate build run: \`${CANDIDATE_RUN_ID_STRING}\` (${CANDIDATE_RUN_URL})"
            echo "Attestation ingestion run: \`${ATTESTATION_RUN_ID}\`"
            echo "Publication run: \`${GITHUB_RUN_ID_STRING}\` (${GITHUB_RUN_URL})"
            echo "Hosted gates: state=passed, multimodal=passed"
            echo "Local qualification attestation: ASR=passed, TTS=passed"
            echo "Unproven: real-device playback, intelligibility, speaker-reference fidelity"
          } > "${RUNNER_TEMP}/asset-release-notes.md"

      - name: Apply only the classified ref mutation
        id: mutate
        env:
          GH_TOKEN: ${{ secrets.WEBGPU_BRIDGE_ASSETS_PAT }}
          ACTION: ${{ steps.preflight.outputs.action }}
          ASSETS_BRANCH: ${{ steps.preflight.outputs.assets_branch }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "error: WEBGPU_BRIDGE_ASSETS_PAT is required for asset publication"
            exit 1
          fi
          ref_push_attempted=false
          push_exit_status=0
          if [ "${ACTION}" = "publish-refs-and-release" ]; then
            cp bridge-dist/* assets-repo/
            git -C assets-repo config user.name "github-actions[bot]"
            git -C assets-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C assets-repo add -- llama_webgpu_bridge.js \
              llama_webgpu_bridge_worker.js llama_webgpu_bridge.d.ts \
              llama_webgpu_core.js llama_webgpu_core.wasm \
              llama_webgpu_core_mem64.js llama_webgpu_core_mem64.wasm \
              manifest.json sha256sums.txt
            git -C assets-repo commit -m "chore: publish webgpu bridge ${RELEASE_TAG}"
            git -C assets-repo tag "${RELEASE_TAG}"
            gh auth setup-git
            ref_push_attempted=true
            set +e
            git -C assets-repo push --atomic origin \
              "HEAD:refs/heads/${ASSETS_BRANCH}" "refs/tags/${RELEASE_TAG}"
            push_exit_status=$?
            set -e
          elif [ "${ACTION}" = "publish-tag-and-release" ]; then
            git -C assets-repo tag "${RELEASE_TAG}" "refs/remotes/origin/${ASSETS_BRANCH}"
            gh auth setup-git
            ref_push_attempted=true
            set +e
            git -C assets-repo push origin "refs/tags/${RELEASE_TAG}"
            push_exit_status=$?
            set -e
          fi
          echo "ref_push_attempted=${ref_push_attempted}" >> "${GITHUB_OUTPUT}"
          echo "push_exit_status=${push_exit_status}" >> "${GITHUB_OUTPUT}"

      - name: Re-fetch and finish or safely classify partial publication
        id: finish
        env:
          GH_TOKEN: ${{ secrets.WEBGPU_BRIDGE_ASSETS_PAT }}
          ASSETS_BRANCH: ${{ steps.preflight.outputs.assets_branch }}
          INITIAL_OUTCOME: ${{ steps.preflight.outputs.initial_outcome }}
          REF_PUSH_ATTEMPTED: ${{ steps.mutate.outputs.ref_push_attempted }}
          PUSH_EXIT_STATUS: ${{ steps.mutate.outputs.push_exit_status }}
          NATIVE_COMMIT: ${{ needs.verify-candidate-and-attestation.outputs.native_commit }}
          EMSCRIPTEN_VERSION: ${{ needs.verify-candidate-and-attestation.outputs.emscripten_version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "error: WEBGPU_BRIDGE_ASSETS_PAT is required for asset publication"
            exit 1
          fi
          state_changed() {
            python3 publication-policy/scripts/release_publication_state.py state-changed \
              --before-json "${RUNNER_TEMP}/preflight.json" --after-json "$1"
          }
          write_mutation_unknown() {
            python3 publication-policy/scripts/release_publication_state.py mutation-unknown \
              --candidate bridge-dist --reason-code "$1" \
              --requery-json "$2" \
              --release-tag "${RELEASE_TAG}" --release-rebuild "${RELEASE_REBUILD}" \
              --assets-repo "${ASSETS_REPO}" --bridge-commit "${BRIDGE_SOURCE_SHA}" \
              --upstream-tag "${UPSTREAM_TAG}" --upstream-commit "${UPSTREAM_COMMIT}" \
              --native-release-tag "${NATIVE_RELEASE_TAG}" \
              --native-manifest-sha256 "${NATIVE_MANIFEST_SHA256}" \
              --native-commit "${NATIVE_COMMIT}" --emscripten-version "${EMSCRIPTEN_VERSION}" \
              --orchestrator-correlation-id "${ORCHESTRATOR_CORRELATION_ID}" \
              --github-run-id "${CANDIDATE_RUN_ID_STRING}" --github-run-url "${CANDIDATE_RUN_URL}" \
              > "${RUNNER_TEMP}/publication-outcome.json"
            cat "${RUNNER_TEMP}/publication-outcome.json"
          }
          classify_remote() (
            set -euo pipefail
            git -C assets-repo fetch --force origin \
              "+refs/heads/${ASSETS_BRANCH}:refs/remotes/origin/${ASSETS_BRANCH}"
            branch_commit="$(git -C assets-repo rev-parse "refs/remotes/origin/${ASSETS_BRANCH}")"
            git -C assets-repo ls-remote origin \
              "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
              > "${RUNNER_TEMP}/current-asset-tag-refs.txt"
            tag_commit=""
            if [ -s "${RUNNER_TEMP}/current-asset-tag-refs.txt" ]; then
              tag_commit="$(python3 publication-policy/scripts/release_contract.py resolve-tag-commit \
                --ls-remote "${RUNNER_TEMP}/current-asset-tag-refs.txt" \
                --tag "${RELEASE_TAG}")"
            fi
            tag_args=()
            if [ -n "${tag_commit}" ]; then
              git -C assets-repo fetch --force origin \
                "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              if [ "$(git -C assets-repo rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "${tag_commit}" ]; then
                echo "error: fetched asset release tag changed after immutable resolution"
                return 1
              fi
              tag_args=(--tag-commit "${tag_commit}")
            fi
            release_args=()
            set +e
            gh api "repos/${ASSETS_REPO}/releases/tags/${RELEASE_TAG}" \
              > "${RUNNER_TEMP}/current-release.json" 2> "${RUNNER_TEMP}/current-release.err"
            lookup_status=$?
            set -e
            if [ "${lookup_status}" -eq 0 ]; then
              release_args=(--release-json "${RUNNER_TEMP}/current-release.json")
            elif ! grep -q '(HTTP 404)' "${RUNNER_TEMP}/current-release.err"; then
              cat "${RUNNER_TEMP}/current-release.err" >&2
              return "${lookup_status}"
            fi
            python3 publication-policy/scripts/release_publication_state.py classify \
              --repository assets-repo --candidate bridge-dist \
              --branch-commit "${branch_commit}" "${tag_args[@]}" "${release_args[@]}" \
              --release-tag "${RELEASE_TAG}" --release-rebuild "${RELEASE_REBUILD}" \
              --assets-repo "${ASSETS_REPO}" --bridge-commit "${BRIDGE_SOURCE_SHA}" \
              --upstream-tag "${UPSTREAM_TAG}" --upstream-commit "${UPSTREAM_COMMIT}" \
              --native-release-tag "${NATIVE_RELEASE_TAG}" \
              --native-manifest-sha256 "${NATIVE_MANIFEST_SHA256}" \
              --native-commit "${NATIVE_COMMIT}" --emscripten-version "${EMSCRIPTEN_VERSION}" \
              --orchestrator-correlation-id "${ORCHESTRATOR_CORRELATION_ID}" \
              --github-run-id "${CANDIDATE_RUN_ID_STRING}" --github-run-url "${CANDIDATE_RUN_URL}"
          )

          set +e
          classify_remote > "${RUNNER_TEMP}/post-refs.json" \
            2> "${RUNNER_TEMP}/post-refs.err"
          post_refs_status=$?
          set -e
          if ! jq -e 'type == "object" and .schema_version == 1 and has("state") and
              .reason_code != "invalid-input-or-state" and
              .orchestrator_correlation_id == env.ORCHESTRATOR_CORRELATION_ID and
              .github_run_id == env.CANDIDATE_RUN_ID_STRING and
              .github_run_url == env.CANDIDATE_RUN_URL and
              .candidate_fingerprint == env.CANDIDATE_FINGERPRINT and
              .qualification_gates == {state_persistence:"passed",multimodal:"passed",
                speech_to_text:"required-local-attestation",
                text_to_speech:"required-local-attestation"}' \
            "${RUNNER_TEMP}/post-refs.json" >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/post-refs.err" >&2
            if [ "${REF_PUSH_ATTEMPTED}" = "true" ]; then
              echo "ref push exit status ${PUSH_EXIT_STATUS}; exact re-query unavailable" >&2
              write_mutation_unknown ref-requery-failed "${RUNNER_TEMP}/post-refs.json"
            else
              jq '.state="remote-requery-failed" | .allowed=false | .action="none" |
                  .outcome="remote-requery-failed" | .reason_code="remote-requery-failed" |
                  .reason="exact remote state could not be re-read before mutation" |
                  .retryable=true | .mutated=false' \
                "${RUNNER_TEMP}/preflight.json" > "${RUNNER_TEMP}/publication-outcome.json"
              cat "${RUNNER_TEMP}/publication-outcome.json"
            fi
            exit 1
          fi
          if [ "${post_refs_status}" -ne 0 ]; then
            cat "${RUNNER_TEMP}/post-refs.json"
            jq --argjson mutated "$(state_changed "${RUNNER_TEMP}/post-refs.json")" \
              '.mutated=$mutated' "${RUNNER_TEMP}/post-refs.json" \
              > "${RUNNER_TEMP}/publication-outcome.json"
            exit 1
          fi
          post_action="$(jq -r '.action' "${RUNNER_TEMP}/post-refs.json")"
          release_mutation_attempted=false
          if [ "${post_action}" = "create-release" ]; then
            release_mutation_attempted=true
            prerelease_args=()
            if [[ "${RELEASE_TAG}" == b* ]] || [[ "${RELEASE_TAG}" =~ -[1-9][0-9]*$ ]]; then
              prerelease_args=(--prerelease)
            fi
            if ! gh release create "${RELEASE_TAG}" bridge-dist/* \
              --repo "${ASSETS_REPO}" --verify-tag --target "$(jq -r '.tag_commit' "${RUNNER_TEMP}/post-refs.json")" \
              --title "${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/asset-release-notes.md" \
              "${prerelease_args[@]}"; then
              echo "release creation returned failure; re-querying exact state" >&2
            fi
          elif [ "${post_action}" = "upload-release-assets" ]; then
            release_mutation_attempted=true
            mapfile -t missing_assets < <(
              jq -er '.missing_release_assets[]' "${RUNNER_TEMP}/post-refs.json"
            )
            upload_paths=()
            for name in "${missing_assets[@]}"; do
              case "${name}" in
                llama_webgpu_bridge.js|llama_webgpu_bridge_worker.js|llama_webgpu_bridge.d.ts|\
                llama_webgpu_core.js|llama_webgpu_core.wasm|\
                llama_webgpu_core_mem64.js|llama_webgpu_core_mem64.wasm|\
                manifest.json|sha256sums.txt) upload_paths+=("bridge-dist/${name}") ;;
                *) echo "error: classifier returned unexpected release asset ${name}"; exit 1 ;;
              esac
            done
            if [ "${#upload_paths[@]}" -eq 0 ]; then
              echo "error: partial release classification contained no missing assets"
              exit 1
            fi
            if ! gh release upload "${RELEASE_TAG}" "${upload_paths[@]}" \
              --repo "${ASSETS_REPO}"; then
              echo "release asset upload returned failure; re-querying exact state" >&2
            fi
          fi
          if [ "${post_action}" = "create-release" ] || [ "${post_action}" = "upload-release-assets" ]; then
            set +e
            classify_remote > "${RUNNER_TEMP}/post-release.json" \
              2> "${RUNNER_TEMP}/post-release.err"
            post_release_status=$?
            set -e
            if ! jq -e 'type == "object" and .schema_version == 1 and has("state") and
                .reason_code != "invalid-input-or-state" and
                .orchestrator_correlation_id == env.ORCHESTRATOR_CORRELATION_ID and
                .github_run_id == env.CANDIDATE_RUN_ID_STRING and
                .github_run_url == env.CANDIDATE_RUN_URL and
                .candidate_fingerprint == env.CANDIDATE_FINGERPRINT and
                .qualification_gates == {state_persistence:"passed",multimodal:"passed",
                  speech_to_text:"required-local-attestation",
                  text_to_speech:"required-local-attestation"}' \
              "${RUNNER_TEMP}/post-release.json" >/dev/null 2>&1; then
              cat "${RUNNER_TEMP}/post-release.err" >&2
              if [ "${release_mutation_attempted}" = "true" ]; then
                write_mutation_unknown release-requery-failed "${RUNNER_TEMP}/post-release.json"
              fi
              exit 1
            fi
            if [ "${post_release_status}" -ne 0 ]; then
              cat "${RUNNER_TEMP}/post-release.json"
              jq --argjson mutated "$(state_changed "${RUNNER_TEMP}/post-release.json")" \
                '.mutated=$mutated' "${RUNNER_TEMP}/post-release.json" \
                > "${RUNNER_TEMP}/publication-outcome.json"
              exit 1
            fi
            if [ "$(jq -r '.state' "${RUNNER_TEMP}/post-release.json")" != "complete" ]; then
              jq --argjson mutated "$(state_changed "${RUNNER_TEMP}/post-release.json")" \
                '.outcome="recoverable-partial" | .reason_code="release-mutation-retry-required" | .retryable=true | .mutated=$mutated' \
                "${RUNNER_TEMP}/post-release.json" > "${RUNNER_TEMP}/publication-outcome.json"
              cat "${RUNNER_TEMP}/publication-outcome.json"
              exit 1
            fi
            source="${RUNNER_TEMP}/post-release.json"
          elif [ "${post_action}" = "none" ]; then
            source="${RUNNER_TEMP}/post-refs.json"
          else
            jq --argjson mutated "$(state_changed "${RUNNER_TEMP}/post-refs.json")" \
              '.outcome="recoverable-partial" | .reason_code="ref-mutation-retry-required" | .retryable=true | .mutated=$mutated' \
              "${RUNNER_TEMP}/post-refs.json" > "${RUNNER_TEMP}/publication-outcome.json"
            cat "${RUNNER_TEMP}/publication-outcome.json"
            exit 1
          fi
          jq --arg outcome "${INITIAL_OUTCOME}" \
            --argjson mutated "$(state_changed "${source}")" \
            '.outcome=$outcome | .mutated=$mutated | .retryable=false' \
            "${source}" > "${RUNNER_TEMP}/publication-outcome.json"
          cat "${RUNNER_TEMP}/publication-outcome.json"

      - name: Export machine-readable publication outcome
        id: final
        if: always()
        run: |
          if [ ! -f "${RUNNER_TEMP}/publication-outcome.json" ]; then
            jq -n --arg correlation "${ORCHESTRATOR_CORRELATION_ID}" \
              --arg run_id "${CANDIDATE_RUN_ID_STRING}" --arg run_url "${CANDIDATE_RUN_URL}" \
              --arg fingerprint "${CANDIDATE_FINGERPRINT}" \
              '{schema_version:1,state:"failed-before-classification",allowed:false,
                action:"none",outcome:"workflow-failure",reason_code:"workflow-failure",
                retryable:false,mutated:false,candidate_fingerprint:$fingerprint,
                orchestrator_correlation_id:$correlation,github_run_id:$run_id,
                github_run_url:$run_url,
                qualification_gates:{state_persistence:"passed",multimodal:"passed",
                  speech_to_text:"required-local-attestation",
                  text_to_speech:"required-local-attestation"}}' \
              > "${RUNNER_TEMP}/publication-outcome.json"
          fi
          outcome="$(jq -c . "${RUNNER_TEMP}/publication-outcome.json")"
          echo "publication_outcome=${outcome}" >> "${GITHUB_OUTPUT}"
          echo "${outcome}"

      - name: Upload publication outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-publication-outcome
          path: ${{ runner.temp }}/publication-outcome.json
