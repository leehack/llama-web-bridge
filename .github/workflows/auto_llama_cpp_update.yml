name: Scan Native-Aligned llama.cpp Releases

on:
  schedule:
    # Daily UTC, aligned with llamadart-native discovery. Each run advances each
    # post-baseline stable provenance by at most one provable transition: dispatch
    # its exact candidate, report an honest qualification wait, or dispatch publish.
    - cron: '23 3 * * *'
  workflow_run:
    # A successful owner-authorized ingestion wakes the same stable orchestrator
    # immediately. The live run and artifact are re-proven before the protected
    # publication environment is reachable; the daily schedule remains fallback.
    workflows: [Ingest Qualification Attestation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Native release channel to inspect
        required: true
        default: stable
        type: choice
        options:
          - stable
          - development
      native_release_tag:
        description: Exact native tag; required for development, optional for stable
        required: false
        default: ''
        type: string
      dry_run:
        description: Plan the next stable transition without dispatching it
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NATIVE_REPO: leehack/llamadart-native
  BRIDGE_REPO: leehack/llama-web-bridge
  ASSETS_REPO: leehack/llama-web-bridge-assets
  REQUESTED_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
  REQUESTED_NATIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.native_release_tag || '' }}
  DRY_RUN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

concurrency:
  group: auto-stable-web-bridge-publication
  cancel-in-progress: false

jobs:
  prepare_release_candidate:
    name: Resolve and verify exact native release provenance
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      release_channel: ${{ steps.candidate.outputs.release_channel }}
      release_count: ${{ steps.candidate.outputs.release_count }}
      continuation_native_release_tag: ${{ steps.continuation.outputs.native_release_tag }}
      continuation_candidate_run_id: ${{ steps.continuation.outputs.candidate_run_id }}
      continuation_attestation_run_id: ${{ steps.continuation.outputs.attestation_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve exact successful attestation continuation
        id: continuation
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          continuation_dir="${RUNNER_TEMP}/attestation-continuation"
          mkdir -p "${continuation_dir}/artifact"
          bridge_default="$(gh api "repos/${BRIDGE_REPO}" --jq '.default_branch')"
          gh api "repos/${BRIDGE_REPO}/actions/runs/${ATTESTATION_RUN_ID}" \
            > "${continuation_dir}/run.json"
          gh api "repos/${BRIDGE_REPO}/actions/runs/${ATTESTATION_RUN_ID}/artifacts?per_page=100" \
            > "${continuation_dir}/artifacts.json"
          verification="$(python3 scripts/release_qualification.py verify-run \
            --run-json "${continuation_dir}/run.json" \
            --artifacts-json "${continuation_dir}/artifacts.json" \
            --run-id "${ATTESTATION_RUN_ID}" \
            --workflow-path .github/workflows/qualification_attestation.yml \
            --head-branch "${bridge_default}" \
            --artifact-name qualification-attestation \
            --run-attempt 1)"
          artifact_id="$(jq -er '.artifact_id' <<<"${verification}")"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${BRIDGE_REPO}/actions/artifacts/${artifact_id}/zip" \
            > "${continuation_dir}/artifact.zip"
          python3 - "${continuation_dir}/artifact.zip" "${continuation_dir}/artifact" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release_qualification import _extract_flat_artifact_archive
          _extract_flat_artifact_archive(
              Path(sys.argv[1]), Path(sys.argv[2]), artifact_type="attestation"
          )
          PY
          python3 scripts/stable_release_orchestrator.py \
            resolve-attestation-continuation \
            --run-json "${continuation_dir}/run.json" \
            --artifacts-json "${continuation_dir}/artifacts.json" \
            --attestation-json "${continuation_dir}/artifact/qualification-attestation.json" \
            --attestation-run-id "${ATTESTATION_RUN_ID}" \
            --default-branch "${bridge_default}" \
            --output-json "${continuation_dir}/resolved.json"
          {
            echo "native_release_tag=$(jq -er '.native_release_tag' "${continuation_dir}/resolved.json")"
            echo "candidate_run_id=$(jq -er '.candidate_run_id' "${continuation_dir}/resolved.json")"
            echo "attestation_run_id=$(jq -er '.attestation_run_id' "${continuation_dir}/resolved.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve native-aligned candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/native-candidates" release-candidates
          gh api --paginate --slurp "repos/${NATIVE_REPO}/releases?per_page=100" \
            > "${RUNNER_TEMP}/native-release-pages.json"
          jq 'add // []' "${RUNNER_TEMP}/native-release-pages.json" \
            > "${RUNNER_TEMP}/native-releases.json"

          if [ "${REQUESTED_CHANNEL}" = "development" ]; then
            if [ -z "${REQUESTED_NATIVE_TAG}" ]; then
              echo "error: development scans require an exact native_release_tag"
              exit 1
            fi
            jq -n --arg tag "${REQUESTED_NATIVE_TAG}" '[$tag]' \
              > "${RUNNER_TEMP}/native-tags.json"
          elif [ "${REQUESTED_CHANNEL}" = "stable" ]; then
            if [ -n "${REQUESTED_NATIVE_TAG}" ]; then
              jq -n --arg tag "${REQUESTED_NATIVE_TAG}" '[$tag]' \
                > "${RUNNER_TEMP}/native-tags.json"
            else
              python3 scripts/stable_release_orchestrator.py \
                select-stable-native-backlog \
                --releases-json "${RUNNER_TEMP}/native-releases.json" \
                --output-json "${RUNNER_TEMP}/native-tags.json"
            fi
          else
            echo "error: unsupported release channel ${REQUESTED_CHANNEL}"
            exit 1
          fi
          jq -r '.[]' "${RUNNER_TEMP}/native-tags.json" \
            > "${RUNNER_TEMP}/native-tags.txt"
          bridge_source_sha="$(git rev-parse HEAD)"
          while IFS= read -r NATIVE_TAG; do
            if [ "${REQUESTED_CHANNEL}" = "stable" ]; then
              if [[ ! "${NATIVE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]; then
                echo "error: stable native release tag is not canonical"
                exit 1
              fi
            elif [[ ! "${NATIVE_TAG}" =~ ^b[0-9]+(-[1-9][0-9]*)?$ ]]; then
              echo "error: development native release tag is not canonical"
              exit 1
            fi

            candidate_dir="${RUNNER_TEMP}/native-candidates/${NATIVE_TAG}"
            mkdir -p "${candidate_dir}"
            jq --arg tag "${NATIVE_TAG}" '
              [.[] | select(.tag_name == $tag)] as $matches
              | if ($matches | length) == 1 then $matches[0]
                else error("native release tag must resolve to exactly one release") end
            ' "${RUNNER_TEMP}/native-releases.json" \
              > "${candidate_dir}/native-release.json"
            native_published_at="$(jq -er '
              .published_at
              | select(type == "string")
              | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' "${candidate_dir}/native-release.json")"

            for name in assets.json SHA256SUMS; do
              asset_id="$(jq -er --arg name "${name}" '
                [.assets[]? | select(.name == $name)] as $matches
                | if (($matches | length) == 1
                      and ($matches[0].id | type) == "number"
                      and $matches[0].id > 0
                      and (($matches[0].id | tostring) | test("^[1-9][0-9]*$")))
                  then $matches[0].id
                  else error("native release asset must be unique with a positive id") end
              ' "${candidate_dir}/native-release.json")"
              gh api -H "Accept: application/octet-stream" \
                "repos/${NATIVE_REPO}/releases/assets/${asset_id}" \
                > "${candidate_dir}/${name}"
            done

            git ls-remote --tags "https://github.com/${NATIVE_REPO}.git" \
              "refs/tags/${NATIVE_TAG}" "refs/tags/${NATIVE_TAG}^{}" \
              > "${candidate_dir}/native-tag-refs.txt"
            native_tag_commit="$(python3 scripts/release_contract.py resolve-tag-commit \
              --ls-remote "${candidate_dir}/native-tag-refs.txt" \
              --tag "${NATIVE_TAG}")"

            provenance_json="release-candidates/${NATIVE_TAG}.json"
            python3 scripts/stable_release_orchestrator.py scan-native \
              --manifest "${candidate_dir}/assets.json" \
              --native-release-tag "${NATIVE_TAG}" \
              --native-release-published-at "${native_published_at}" \
              --bridge-source-sha "${bridge_source_sha}" \
              --channel "${REQUESTED_CHANNEL}" \
              --output-json "${provenance_json}"

            upstream_tag="$(jq -er '.upstream_tag' "${provenance_json}")"
            upstream_commit="$(jq -er '.upstream_commit' "${provenance_json}")"
            manifest_sha256="$(jq -er '.native_manifest_sha256' "${provenance_json}")"
            python3 scripts/release_contract.py validate-native-release \
              --manifest "${candidate_dir}/assets.json" \
              --checksums "${candidate_dir}/SHA256SUMS" \
              --release-json "${candidate_dir}/native-release.json" \
              --manifest-sha256 "${manifest_sha256}" \
              --native-release-tag "${NATIVE_TAG}" \
              --upstream-tag "${upstream_tag}" \
              --upstream-commit "${upstream_commit}" \
              --native-tag-commit "${native_tag_commit}"
          done < "${RUNNER_TEMP}/native-tags.txt"

          release_count="$(wc -l < "${RUNNER_TEMP}/native-tags.txt" | tr -d ' ')"
          if [ "${release_count}" -eq 0 ]; then
            jq -n '[]' > release-candidates.json
          else
            jq -s 'sort_by(.native_release_published_at, .native_release_tag)' \
              release-candidates/*.json > release-candidates.json
          fi
          echo "release_channel=${REQUESTED_CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "release_count=${release_count}" >> "${GITHUB_OUTPUT}"

      - name: Report development scan without orchestrating
        if: ${{ env.REQUESTED_CHANNEL != 'stable' }}
        run: |
          set -euo pipefail
          {
            echo "### Development native scan"
            echo
            echo "Manual development scans only prepare exact candidate inputs. They never"
            echo "dispatch a candidate build, an attestation ingestion, or a publication."
            echo
            echo '```json'
            cat release-candidates.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verified candidate provenance
        uses: actions/upload-artifact@v4
        with:
          name: bridge-release-candidate
          if-no-files-found: error
          path: release-candidates.json

  advance_stable_release:
    name: Advance each exact stable publication by one stage
    needs: prepare_release_candidate
    if: ${{ needs.prepare_release_candidate.outputs.release_channel == 'stable' && needs.prepare_release_candidate.outputs.release_count != '0' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) || (github.event_name == 'workflow_run' && needs.prepare_release_candidate.outputs.continuation_native_release_tag != '' && needs.prepare_release_candidate.outputs.continuation_candidate_run_id != '' && needs.prepare_release_candidate.outputs.continuation_attestation_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Reuse the established main-only publication environment and its single
    # owner credential. No repository-level or newly named secret is accepted.
    environment:
      name: bridge-assets-publication
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: bridge-release-candidate

      - name: Prove the dispatcher environment before exposing its credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${BRIDGE_REPO}/environments/bridge-assets-publication" \
            > "${RUNNER_TEMP}/publication-environment.json"
          gh api "repos/${BRIDGE_REPO}/environments/bridge-assets-publication/deployment-branch-policies" \
            > "${RUNNER_TEMP}/publication-branch-policies.json"
          python3 scripts/release_contract.py validate-environment \
            --environment-json "${RUNNER_TEMP}/publication-environment.json" \
            --branch-policies-json "${RUNNER_TEMP}/publication-branch-policies.json"

      - name: Advance the stable publication pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_NATIVE_RELEASE_TAG: ${{ needs.prepare_release_candidate.outputs.continuation_native_release_tag }}
          CONTINUATION_CANDIDATE_RUN_ID: ${{ needs.prepare_release_candidate.outputs.continuation_candidate_run_id }}
          CONTINUATION_ATTESTATION_RUN_ID: ${{ needs.prepare_release_candidate.outputs.continuation_attestation_run_id }}
          # This existing environment-scoped PAT must identify the repository
          # owner, read assets immutable-release governance, and have Actions
          # write permission on the bridge repository. The orchestrator proves
          # identity/governance live and fails closed if either capability is absent.
          WEBGPU_BRIDGE_ASSETS_PAT: ${{ secrets.WEBGPU_BRIDGE_ASSETS_PAT }}
        run: |
          set -euo pipefail
          dry_run_flag=()
          if [ "${DRY_RUN_REQUESTED}" = "true" ]; then
            dry_run_flag+=(--dry-run)
          fi
          continuation_flags=()
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            continuation_flags+=(
              --continuation-native-release-tag "${CONTINUATION_NATIVE_RELEASE_TAG}"
              --continuation-candidate-run-id "${CONTINUATION_CANDIDATE_RUN_ID}"
              --continuation-attestation-run-id "${CONTINUATION_ATTESTATION_RUN_ID}"
            )
          fi
          python3 scripts/stable_release_orchestrator.py orchestrate-backlog \
            --provenance-list-json release-candidates.json \
            --workspace "${RUNNER_TEMP}/orchestrator" \
            --output-plan-json orchestration-plan.json \
            --step-summary-file "${GITHUB_STEP_SUMMARY}" \
            "${continuation_flags[@]}" \
            "${dry_run_flag[@]}"

      - name: Upload orchestration plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stable-release-orchestration-plan
          if-no-files-found: ignore
          path: orchestration-plan.json
