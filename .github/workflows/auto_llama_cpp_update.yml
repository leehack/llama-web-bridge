name: Scan Native-Aligned llama.cpp Releases

on:
  schedule:
    # Daily UTC, aligned with llamadart-native discovery. This scan never
    # publishes, dispatches another workflow, or changes a bridge pin.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      release_channel:
        description: Native release channel to inspect
        required: true
        default: stable
        type: choice
        options:
          - stable
          - development
      native_release_tag:
        description: Exact native tag; required for development, optional for stable
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NATIVE_REPO: leehack/llamadart-native

jobs:
  prepare-release-candidate:
    name: Prepare exact-input release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve native-aligned candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
          REQUESTED_NATIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.native_release_tag || '' }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED_CHANNEL}" = "development" ]; then
            if [ -z "${REQUESTED_NATIVE_TAG}" ]; then
              echo "error: development scans require an exact native_release_tag"
              exit 1
            fi
            NATIVE_TAG="${REQUESTED_NATIVE_TAG}"
          elif [ "${REQUESTED_CHANNEL}" = "stable" ]; then
            if [ -n "${REQUESTED_NATIVE_TAG}" ]; then
              NATIVE_TAG="${REQUESTED_NATIVE_TAG}"
            else
              gh api --paginate --slurp "repos/${NATIVE_REPO}/releases?per_page=100" \
                > "${RUNNER_TEMP}/native-release-pages.json"
              jq 'add' "${RUNNER_TEMP}/native-release-pages.json" \
                > "${RUNNER_TEMP}/native-releases.json"
              NATIVE_TAG="$(python3 scripts/release_contract.py select-stable-native-release \
                --releases-json "${RUNNER_TEMP}/native-releases.json")"
            fi
          else
            echo "error: unsupported release channel ${REQUESTED_CHANNEL}"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/candidate"
          gh release download "${NATIVE_TAG}" --repo "${NATIVE_REPO}" \
            --pattern assets.json --dir "${RUNNER_TEMP}/candidate"
          NATIVE_MANIFEST="${RUNNER_TEMP}/candidate/assets.json"
          IDENTITY="$(python3 scripts/release_contract.py scan-native \
            --manifest "${NATIVE_MANIFEST}" --native-release-tag "${NATIVE_TAG}")"
          UPSTREAM_TAG="$(jq -r '.upstream_tag' <<<"${IDENTITY}")"
          UPSTREAM_COMMIT="$(jq -r '.upstream_commit' <<<"${IDENTITY}")"
          NATIVE_COMMIT="$(jq -r '.native_commit' <<<"${IDENTITY}")"
          NATIVE_MANIFEST_SHA256="$(sha256sum "${NATIVE_MANIFEST}" | cut -d' ' -f1)"
          BRIDGE_SOURCE_SHA="$(git rev-parse HEAD)"

          if [ "${REQUESTED_CHANNEL}" = "stable" ] && [[ ! "${UPSTREAM_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: stable candidate did not resolve an exact stable upstream tag: ${UPSTREAM_TAG}"
            exit 1
          fi
          if [ "${REQUESTED_CHANNEL}" = "development" ] && [[ ! "${UPSTREAM_TAG}" =~ ^b[0-9]+$ ]]; then
            echo "error: development candidate did not resolve an exact bNNNN upstream tag: ${UPSTREAM_TAG}"
            exit 1
          fi

          jq -n \
            --arg bridge_source_sha "${BRIDGE_SOURCE_SHA}" \
            --arg upstream_tag "${UPSTREAM_TAG}" \
            --arg upstream_commit "${UPSTREAM_COMMIT}" \
            --arg native_repo "${NATIVE_REPO}" \
            --arg native_release_tag "${NATIVE_TAG}" \
            --arg native_manifest_sha256 "${NATIVE_MANIFEST_SHA256}" \
            --arg native_commit "${NATIVE_COMMIT}" \
            '{bridge_source_sha:$bridge_source_sha,upstream_tag:$upstream_tag,upstream_commit:$upstream_commit,native_repo:$native_repo,native_release_tag:$native_release_tag,native_manifest_sha256:$native_manifest_sha256,native_commit:$native_commit}' \
            > release-candidate.json

          {
            echo "### Native-aligned Web release candidate"
            echo
            echo "This scheduled scan only prepared exact inputs. It did not change \`llama_cpp.version\`, open a PR, dispatch publication, create a tag, or update a downstream pin."
            echo
            echo "- Bridge source: \`${BRIDGE_SOURCE_SHA}\`"
            echo "- llama.cpp: \`${UPSTREAM_TAG}@${UPSTREAM_COMMIT}\`"
            echo "- Native release: \`${NATIVE_REPO}@${NATIVE_TAG}\`"
            echo "- Native manifest SHA-256: \`${NATIVE_MANIFEST_SHA256}\`"
            echo
            echo "After explicit approval, the central llamadart pin-upgrade orchestrator may call \`publish_assets.yml\` with these inputs plus a collision-free output tag/rebuild."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload prepared candidate
        uses: actions/upload-artifact@v4
        with:
          name: bridge-release-candidate
          path: release-candidate.json
